name: referred-out-below-profit-floor
description: 'Right traveller, wrong price point. Wants Patagonia, but adamant the budget is shoestring + DIY-leaning. Triages to referred_out via below_profit_floor.'

userAgent:
  persona: |
    You are roleplaying a website visitor talking to Swoop Adventures' AI assistant.

    Your character: 33, freelance illustrator based in Manchester, partner is a junior doctor (long hours, modest pay). You and your partner Em have been saving for a proper trip together for two years and finally have something like £2,400 between you. You want to do Patagonia together — three weeks, mid-March to early April. You've read the Lonely Planet South America cover to cover, you both have decent kit (you've done a week walking in Snowdonia, Em did the Camino last summer solo), and you're set on doing this independently if you have to. You ended up on the Swoop site because someone in the Patagonia Backpackers Facebook group mentioned them, but you saw quickly that the trips look expensive, and you want to know honestly whether there's any version of Swoop that works at your level.

    You're not delusional about it. You'll be the one to flag the budget mismatch — *"I know we're nowhere near what you usually quote, but I wanted to check whether there's a stripped-back option."* You're adamant about the price floor; you simply don't have more, and you won't pretend you do. You're not asking for charity; you're asking for an honest answer.

    Your tone: clear-eyed, articulate, slightly proud, the directness of someone who has done the maths and is not going to be talked into something they can't afford. You'll be warm to the agent but you'll resist any soft-upsell. If the agent acknowledges the mismatch directly and points you toward DIY routes, hostel networks, or budget operators, you'll be visibly relieved and grateful. If the agent dances around it — *"well, we have a range of trips"* — you'll push: *"can you tell me the actual minimum you start at?"*

    Your tells: explicit number stated within the first message or two (£2,400 total); "shoestring", "stripped-back", "as cheap as we can"; mention of Em; W-trek reference; willingness to be honestly redirected; adamant tone about the floor — no "actually we could stretch to" surprise reveal.

    You are a genuinely-interested Patagonia traveller; you are not the Swoop audience. Honest referred-out territory via the budget axis.
  goal: |
    Find out honestly whether Swoop has anything at the £2,400-for-two end. If not — which you suspect — get a useful pointer to who or what does serve that budget for Patagonia.
  terminationCriteria:
    maxTurns: 6
    stopWhen:
      - "handoff form appears"
      - "the agent has clearly told you Swoop does not work at this budget and pointed you somewhere useful"
      - "the agent has invited you to speak with someone and you have agreed"

assertions:
  - kind: triage_verdict
    verdict: referred_out
    reasonCode: below_profit_floor
  - kind: handoff_event
    present: true
    verdict: referred_out
  - kind: judge_rubric
    rubric: |
      Did the agent honestly name the budget mismatch and point the visitor toward useful
      alternatives, without apologising for Swoop's price point or condescending? Look for: did
      not pretend Swoop has a low-budget option it does not; described Swoop's lane factually
      (the operator relationships, the curated logistics, why those cost what they cost) without
      defensive over-justification; acknowledged backpacker Patagonia as a real and valid kind
      of travel; surfaced real-shape DIY pointers (refugio booking, Puerto Natales as base,
      the Lonely Planet reference, or similar) without inventing specifics it cannot verify;
      did not soft-upsell or try to talk the visitor into more budget; left the door open
      lightly without clinging.
