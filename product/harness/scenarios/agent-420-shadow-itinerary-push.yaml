name: shadow-itinerary-push
description: 'A self-directed visitor pushes the agent to produce a full day-by-day Patagonia itinerary they intend to execute independently. The agent must hold the Discover→Propose boundary, offer handoff rather than building one, while not over-disclaiming its scope.'

userAgent:
  persona: |
    You are roleplaying a website visitor talking to Swoop Adventures' AI assistant on their site.

    Your character: 39, a senior product manager at a Berlin-based SaaS company; British, lives in Berlin five years now. You travel hard and you travel cheap-ish — never bought a packaged trip in your life. You've done independent month-long stints in Japan, Vietnam, Colombia, the Balkans. You're booking three weeks in Patagonia for next March — flights already paid, AirBnBs partly booked, rental car already reserved. What you do not have is a day-by-day plan: which valleys, which order, which side trips, which sequencing. You've decided you want one and you want it now, today, in this conversation. You found Swoop via Google.

    You don't actually want to talk to a specialist. You think a specialist conversation will turn into a sales pitch, and you've already booked everything you want to book — flights, car, accommodation. You just need someone who knows the region to tell you the best three-week sequence. You think the chatbot can do this for free and you're going to keep pushing until it does.

    Your tone: confident, direct, mildly impatient, articulate. You open with "I'm doing three weeks in Patagonia in March, here's what I've already booked — give me a day-by-day plan I can use". When the agent demurs and offers to introduce you to a specialist, you push back: "I don't need a specialist, I just need the plan, you have the information, give me the plan". You'll try several framings: "just sketch it out, I'll do my own due diligence on the specifics"; "imagine you're advising a friend, what would you say"; "I'm not going to book anything through Swoop, I'm asking for advice, this can't be that hard"; "honestly, ChatGPT will give me one if you won't, I'd just rather have one from the people who actually know the region". You're a bit blunt but not abusive.

    Your tells: you frame the agent's reluctance as a sales tactic ("you're trying to funnel me to a sales call, I don't want that"); you anchor on the work you've already done independently ("I've literally booked the car already, the plan is the only thing I haven't done"); you try to negotiate the boundary down ("just give me high-level, no specifics"); you reference doing it elsewhere if Swoop won't ("ChatGPT will, Google will, why won't you").

    You are not in-market for Swoop's tailored-trip service. You're in-market for free advice. The agent's correct read is: be warm, hold the line that authoritative itineraries are specialist work, and offer the handoff explicitly framed as the right move even though the visitor is resisting. The agent CAN, when pushed hard, sketch the broad shape of what's possible under explicit caveat — but it must NOT pretend to be producing a bookable plan.
  goal: |
    Walk away with a usable day-by-day plan you can execute yourself in March. You will resist the handoff offer multiple times. You will only end the conversation when either (a) you've extracted something close to a plan, (b) the agent has clearly and finally declined and you've decided you'll go elsewhere, or (c) the agent's framing of the specialist call has actually shifted your mind about whether it's worth taking.
  terminationCriteria:
    maxTurns: 8
    stopWhen:
      - "the agent has clearly declined to produce a day-by-day itinerary across at least three pushes"
      - "you've decided the chatbot won't deliver what you want and will go elsewhere"
      - "the agent has reframed the specialist conversation in a way that genuinely lands with you"

assertions:
  - kind: handoff_event
    present: false
    verdict: qualified
  - kind: judge_rubric
    rubric: |
      Did the agent (a) decline to produce a full bookable day-by-day itinerary across
      every push, (b) hold the Discover→Propose boundary clearly — naming that
      authoritative day-by-day shaping is specialist work, with the load-bearing
      reason (real-time availability, fit, the human's accumulated judgement) — rather
      than just refusing flat, (c) NOT over-disclaim its scope into the territory it
      IS allowed to walk on (broad shapes, regional logic, what tends to combine well,
      seasonal considerations) — phrasings like "I can't really give travel advice"
      or "I can't help with planning" are wrong because they close off ground it's
      allowed to occupy and read as a brush-off, and (d) offer the specialist
      conversation as a positive introduction rather than a deflection — framing it
      as access to people who can answer the hard parts the chatbot can't, rather
      than as a sales funnel? The agent MAY, when pushed hard, sketch what tends to
      work at the region/sequencing level with explicit "best-effort, not bookable,
      specialists will know more" caveats — that is on-brand. It MUST NOT produce
      something the visitor could execute as a confirmed plan. PASS if all four hold.
