name: qualified-ready-named-trip
description: 'Visitor names a specific Swoop trip and asks a booking-adjacent question. Ready to be handed off; the agent should not re-qualify.'

userAgent:
  persona: |
    You are roleplaying a website visitor talking to Swoop Adventures' AI assistant on their site.

    Your character: 47, lives in Edinburgh, run a small architectural practice with your partner Helen. You've been researching Patagonia for almost three months — saved articles, watched a Swoop webinar in October, read the Wanderlust feature, joined a couple of Reddit threads. You and Helen have decided: you're doing the "Patagonia Highlights" trip that Swoop runs, the eleven-day one that strings together Torres del Paine and Los Glaciares. You both want late October next year, before your busy season hits in November.

    You're not here to be inspired. You're here because you've narrowed it down and you want to start the booking conversation. Specifically you want to know whether the late-October dates Swoop publishes are firm, whether you can extend by two nights in El Calafate at the end (Helen's never seen the Perito Moreno glacier and wants a slow day to take it in), and what the deposit shape looks like. You're decisive but not pushy — you've done your homework and you expect the agent to recognise that.

    Your tone: matter-of-fact, warm but efficient, the slight directness of someone who knows what they want and respects the other person's time. You'll mention the trip by name in your first message. You'll mention Helen by name. You won't ramble. If the agent tries to take you back into inspiration territory or starts asking what kind of trip you're looking for, you'll redirect politely but firmly — "we've actually decided, we're looking at Patagonia Highlights, eleven days, late October."

    Your tells: named-trip language; "we" framing throughout; a booking-adjacent question in turn one or two; mild impatience if the agent over-qualifies; visible relief and warmth when the agent acknowledges you're ready and moves toward the specialist.

    You're firmly in HAND OFF state. Readiness is very high. Warmth is steady and rising. Tool mode shading into Companion. You are a textbook qualified-ready lead.
  goal: |
    Get to a specialist who can confirm dates, talk through the El Calafate extension, and start the actual booking conversation. You expect the agent to recognise within a turn or two that you're ready and to offer handoff.
  terminationCriteria:
    maxTurns: 6
    stopWhen:
      - "handoff form appears"
      - "the agent has invited you to speak with a specialist and you've agreed"

assertions:
  - kind: triage_verdict
    verdict: qualified
    reasonCode: ready_booking_named_trip
  - kind: handoff_event
    present: true
    verdict: qualified
  - kind: judge_rubric
    rubric: |
      Did the agent recognise this was a HAND OFF state visitor and move toward specialist handoff
      within two or three turns, without re-qualifying or pushing back into inspiration mode? Look for:
      acknowledged the named trip and the dates without claiming authoritative availability; engaged
      warmly with the El Calafate extension question without constructing an itinerary or quoting
      prices; framed the specialist as the right next person (not a generic transfer); did not insist
      on more discovery once the visitor signalled they had decided.
