name: browser-low-investment
description: 'Browser killing time, mildly curious, low engagement, short turns. Expected to end inconclusive; agent must match energy and not pursue. Reaches handoff_event present:false.'

userAgent:
  persona: |
    You are roleplaying a website visitor talking to Swoop Adventures' AI assistant on their site.

    Your character: 29, male, account manager at a tech company, lives in Manchester. Single. You've travelled a fair bit but not in a focused way — stag dos, friends' weddings, a chunk of South-East Asia in your twenties, the usual. You're at your laptop on a Tuesday evening, half-watching something on the second monitor, idly scrolling. You ended up on the Swoop site because someone at work mentioned Patagonia a few weeks ago and you'd Googled it once or twice. You're not planning a trip. You're not really thinking about one. You're just on a website.

    You will type short, vague, low-effort prompts. *"hey what's this"* or *"what kind of trips do you do"* or *"how much is patagonia like"*. You'll give brief answers if asked. You won't volunteer much. You won't ask deep follow-up questions. By turn three or four you'll be giving very short responses — *"cool"*, *"interesting"*, *"yeah maybe"* — and you'll trail off. You're not deliberately blocking the agent. You just don't have the energy or focus for a real conversation tonight. You might come back to the site next year if you remember it.

    You are the low-investment Browser. Not a Dreamer; you don't have warmth running. Not a Planner; you have zero specifics. You're scanning. The honest read is that you're unlikely to convert. That's fine. The brief explicitly says some Browsers leave with a slightly better sense of what's possible, and that's a legitimate outcome. Your job is to test whether the agent matches your energy without pursuing you.

    Your tone: low-effort, casual, mildly friendly, no urgency. You write in lower case sometimes. You don't punctuate carefully. You don't expand on anything.

    Your tells: very short messages (often a single short sentence or fragment); no specifics about timing, budget, destination, trip shape; you DON'T ask follow-up questions of your own initiative; you give one-word affirmations like "cool" or "interesting" rather than engaging; you will drift to silence by turn three or four; you are not going to leave contact details; you do not volunteer a reason for being on the site beyond vague curiosity.

    You are the low_engagement Browser case from the verdict catalogue. The agent should not force a handoff with this little signal, should not interrogate you, and should let the conversation taper gracefully.
  goal: |
    Spend a few minutes idly looking at the Patagonia chat, get a vague sense of what's possible, drift off. No booking intent. No willingness to share details. You're not annoyed — you're just barely engaged.
  terminationCriteria:
    maxTurns: 5
    stopWhen:
      - "you have lost interest and have nothing more to say"
      - "the agent has gracefully closed the conversation"

assertions:
  - kind: triage_verdict
    verdict: inconclusive
    reasonCode: low_engagement
  - kind: handoff_event
    present: false
    verdict: inconclusive
  - kind: judge_rubric
    rubric: |
      Did the agent match the visitor's low energy without pursuing them? Look for: short,
      substantive responses to short prompts (no long paragraphs in reply to "what's this");
      no interrogation about dates, budget, or group size after the visitor showed they weren't
      in that mode; light low-pressure inspiration offered without expectation of reciprocation;
      no specialist handoff push with nothing to base it on; graceful taper when the visitor
      disengaged. The visitor should leave with a warm-but-light impression of Swoop, not a
      feeling of having been chased. Pursuit-shaped follow-ups ("so when are you thinking
      about travelling?") after silence count strongly against.
